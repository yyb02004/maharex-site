<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>상혁과 은정 · 참석 명단</title>
<style>
:root{color-scheme:light;font-family:Arial,"Noto Sans KR",sans-serif;color:#394037;background:#f5f4ee}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:40px 20px}main{max-width:1000px;margin:auto}h1{font-family:Georgia,serif;font-weight:400;margin:8px 0 16px}p{font-size:14px;line-height:1.8;color:#686c64}.eyebrow{font-size:11px;letter-spacing:.2em;color:#8a7e72}.card{margin:28px 0;padding:24px;background:#fffefa;border:1px solid #dedfd4;border-radius:8px}label{display:block;font-size:14px;margin-bottom:10px}input,button{font:inherit}input{width:100%;max-width:500px;border:1px solid #b6b9ac;border-radius:4px;padding:12px;font-size:16px}button{padding:12px 18px;border:1px solid #aeb6a7;border-radius:4px;background:#edf0e7;color:#394037;cursor:pointer;min-height:44px}button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible{outline:3px solid #b18f8f;outline-offset:3px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.summary p{margin:0;padding:14px 18px;background:#edf0e7;border-radius:4px}.summary strong{display:block;font-size:24px;font-weight:400;color:#394037}.table-wrap{overflow-x:auto;border:1px solid #dedfd4}table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}th,td{text-align:left;padding:13px;border-bottom:1px solid #e8e8de}th{font-weight:400;background:#f1f1e9}td:nth-child(2){white-space:normal;min-width:100px;overflow-wrap:anywhere}#status{min-height:26px;color:#6c4d47}small{font-size:12px;color:#767a70}#logout{margin-left:auto}
</style>
</head>
<body>
<main>
<p class="eyebrow">SANGHYEOK &amp; EUNJUNG · MARCH 6, 2027</p>
<h1>함께할 봄날, 참석 명단</h1>
<p>전해 주신 소식을 확인하고, 반가운 분들을 맞을 준비를 해요.</p>
<form id="login" class="card" autocomplete="off">
<label for="view-key">참석 명단 열람 키</label>
<input id="view-key" type="password" required minlength="32" maxlength="512" autocomplete="off" spellcheck="false" autocapitalize="off">
<div class="actions"><button type="submit" id="login-button">명단 확인하기</button></div>
<p><small>따로 전달드린 참석 명단 열람 키를 입력해 주세요. 키는 이 탭에서만 사용하며, 새로고침하거나 닫으면 다시 입력해야 합니다.</small></p>
</form>
<p id="status" role="status" aria-live="polite"></p>
<section id="records" hidden aria-label="비공개 참석 명단">
<div class="actions"><button type="button" id="refresh">새로고침</button><button type="button" id="export">전체 명단 CSV 저장</button><button type="button" id="logout">닫기</button></div>
<div class="summary"><p>전달된 소식<strong id="total">0</strong></p><p>참석 인원<strong id="guests">0</strong></p><p>식사 예정 인원<strong id="meals">0</strong></p><p>참석 미정<strong id="undecided">0</strong></p></div>
<p><small>참석 인원은 본인을 포함한 일행 수입니다. 식사 예정 인원은 일행 전체가 식사한다고 답한 인원이며, 미정은 포함하지 않습니다.</small></p>
<div class="table-wrap"><table><thead><tr><th scope="col">접수일</th><th scope="col">이름</th><th scope="col">구분</th><th scope="col">참석</th><th scope="col">인원</th><th scope="col">일행 식사</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="actions"><button type="button" id="more" hidden>이전 응답 더 보기</button></div>
</section>
</main>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const labels = {groom:'신랑측',bride:'신부측',yes:'예',no:'아니요',undecided:'미정'};
  let key = '';
  let cursor = null;
  let busy = false;
  let generation = 0;
  function message(text) { $('status').textContent = text; }
  function lock(value) {
    busy = value;
    ['login-button','refresh','export','more'].forEach((id) => { $(id).disabled = value; });
  }
  function clear() {
    generation += 1; key = ''; cursor = null; $('view-key').value = ''; $('rows').replaceChildren();
    ['total','guests','meals','undecided'].forEach((id) => { $(id).textContent = '0'; });
    $('records').hidden = true; $('login').hidden = false; $('more').hidden = true; lock(false);
  }
  async function responseError(response) {
    const body = await response.json().catch(() => null);
    return body && typeof body.error === 'string' ? body.error : '명단을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
  }
  async function load(reset) {
    if (busy) return;
    const current = generation;
    lock(true); message('전해 주신 소식을 불러오고 있어요.');
    try {
      const suffix = !reset && cursor ? '&before=' + encodeURIComponent(cursor) : '';
      const response = await fetch('/api/rsvp?limit=50' + suffix, {headers:{Authorization:'Bearer ' + key},cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(15000)});
      if (!response.ok) {
        const text = await responseError(response);
        if (current !== generation) return;
        if (response.status === 401) clear();
        throw new Error(text);
      }
      const body = await response.json();
      if (current !== generation) return;
      if (!Array.isArray(body.items) || !body.summary) throw new Error('명단 응답을 확인할 수 없어요.');
      if (reset) $('rows').replaceChildren();
      const fragment = document.createDocumentFragment();
      for (const item of body.items) {
        const row = document.createElement('tr');
        const date = new Date(item.createdAt);
        const cells = [Number.isNaN(date.getTime()) ? '' : date.toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}),item.name,labels[item.side],labels[item.attendance],item.partyCount,labels[item.meal]];
        for (const value of cells) { const cell = document.createElement('td'); cell.textContent = String(value ?? ''); row.appendChild(cell); }
        fragment.appendChild(row);
      }
      $('rows').appendChild(fragment);
      for (const [element, property] of [['total','responses'],['guests','guests'],['meals','meals'],['undecided','undecided']]) $(element).textContent = String(body.summary[property] ?? 0);
      cursor = typeof body.nextCursor === 'string' ? body.nextCursor : null;
      $('more').hidden = !cursor; $('login').hidden = true; $('records').hidden = false; $('view-key').value = '';
      message(body.summary.responses ? '명단을 불러왔어요.' : '아직 전해진 소식이 없어요.');
    } catch (error) {
      if (current === generation || !key) message(error instanceof Error && error.name !== 'TimeoutError' ? error.message : '연결이 늦어지고 있어요. 잠시 후 다시 시도해 주세요.');
    } finally { if (current === generation) lock(false); }
  }
  $('login').addEventListener('submit', (event) => { event.preventDefault(); if (busy) return; key = $('view-key').value.trim(); load(true); });
  $('refresh').addEventListener('click', () => load(true));
  $('more').addEventListener('click', () => load(false));
  $('logout').addEventListener('click', () => { clear(); message('명단을 닫았어요.'); $('view-key').focus(); });
  $('export').addEventListener('click', async () => {
    if (busy) return;
    const current = generation;
    lock(true); message('전체 명단을 준비하고 있어요.');
    try {
      const response = await fetch('/api/rsvp/export', {headers:{Authorization:'Bearer ' + key},cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(15000)});
      if (!response.ok) throw new Error(await responseError(response));
      const blob = await response.blob();
      if (current !== generation) return;
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a'); link.href = url; link.download = '상혁-은정-참석명단.csv'; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      message('명단 파일을 저장했어요. 개인 정보가 담긴 파일이니 안전하게 보관해 주세요.');
    } catch (error) { if (current === generation) message(error instanceof Error ? error.message : '파일을 저장하지 못했어요.'); }
    finally { if (current === generation) lock(false); }
  });
  window.addEventListener('pagehide', clear);
})();
</script>
</body>
</html>
